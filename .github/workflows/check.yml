name: Check

on:
  pull_request:
  workflow_call:
    secrets:
      CONFIDENTIAL_PATTERNS:
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Type and content check
        run: npm run check
      # GITHUB_TOKEN enables the live GitHub section (src/lib/github.ts), so the gate
      # below scans the same live repo data the deploy publishes.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Link crawl
        run: npm run links
      - name: Lighthouse budget
        run: npm run lhci
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Tests
        run: npm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Fail closed (GATE_REQUIRED=1) on push, schedule and workflow_dispatch; under
      # workflow_call this job sees the caller's event_name. Same-repo PRs not opened by
      # Dependabot receive secrets too, so they are required as well. Fork and Dependabot
      # PRs get no secret and keep the warning. Empty vars mean unset (ADR 0005 amendment).
      - name: Confidentiality gate
        run: npm run gate
        env:
          CONFIDENTIAL_PATTERNS: ${{ secrets.CONFIDENTIAL_PATTERNS }}
          GATE_REQUIRED: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '1' || '' }}
          CONFIDENTIAL_PATTERNS_MIN: ${{ vars.CONFIDENTIAL_PATTERNS_MIN }}
          CONFIDENTIAL_PATTERNS_SHA256: ${{ vars.CONFIDENTIAL_PATTERNS_SHA256 }}
