name: Check

on:
  pull_request:
  workflow_call:
    secrets:
      CONFIDENTIAL_PATTERNS:
        required: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - name: Type and content check
        run: npm run check
      # The only build of the site in CI (#150). Every later step reads this dist/; outside
      # pull requests the last step uploads it, and deploy.yml publishes that upload as is.
      # GITHUB_TOKEN enables the live GitHub section (src/lib/github.ts), so the gate below
      # scans the same live repo data that ships.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Content hash of every non-hidden file in dist/, the set upload-pages-artifact archives.
      - name: Hash dist
        id: dist-hash
        run: |
          hash=$( (cd dist && find . -type f -not -path '*/.*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) | sha256sum | cut -d' ' -f1)
          echo "dist sha256 after Build: $hash"
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
      - name: Link crawl
        run: npm run links
      # Skipped on the daily scheduled rebuild (#154, ADR 0003): that run publishes date-gated
      # content, not new code, and a score just under budget must not block the day's article.
      # Under workflow_call, github.event_name is the caller's event.
      - name: Lighthouse budget
        if: github.event_name != 'schedule'
        run: npm run lhci
      - name: Upload Lighthouse report
        if: always() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
      # Headless Chrome over dist/ from the Build step: console, view transitions, redirects,
      # 360/320 px overflow and the hero's degraded paths. The self-test proves it can fail.
      - name: Smoke self-test
        run: npm run smoke:self
      - name: Browser smoke
        run: npm run smoke
      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: .smoke/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore
      # test:ci has no pretest hook, so the tests read the dist/ above and never rebuild it.
      - name: Tests
        run: npm run test:ci
      - name: Confidentiality gate
        run: npm run gate
        env:
          CONFIDENTIAL_PATTERNS: ${{ secrets.CONFIDENTIAL_PATTERNS }}
      # Any new check goes above this step. Fails if any step since Build changed dist/.
      - name: Verify dist unchanged
        env:
          EXPECTED: ${{ steps.dist-hash.outputs.sha256 }}
        run: |
          hash=$( (cd dist && find . -type f -not -path '*/.*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) | sha256sum | cut -d' ' -f1)
          echo "dist sha256 before upload: $hash"
          if [ -z "$EXPECTED" ] || [ "$hash" != "$EXPECTED" ]; then
            echo "::error::dist/ changed after Build (expected $EXPECTED, got $hash)"
            exit 1
          fi
      # Pull requests check but publish nothing. Under workflow_call the event is the
      # caller's push, schedule or dispatch, so deploy.yml runs get the github-pages artifact.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
