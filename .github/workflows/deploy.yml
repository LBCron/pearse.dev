name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Daily rebuild so posts dated in the future go live on their pubDate.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # check builds dist/ once, gates and tests it, and uploads it as the github-pages
  # artifact of this run. deploy publishes that artifact: there is no second build.
  check:
    uses: ./.github/workflows/check.yml
    secrets:
      CONFIDENTIAL_PATTERNS: ${{ secrets.CONFIDENTIAL_PATTERNS }}

  deploy:
    needs: check
    # The github-pages environment only accepts master. A dispatch on another branch runs
    # check (and its upload) and skips this job instead of failing it.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
