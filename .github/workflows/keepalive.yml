name: Keep scheduled workflows alive

# GitHub disables scheduled workflows in a public repo after 60 days with no repository activity.
# Once a week, re-enable the deploy workflow (the daily rebuild that publishes posts on their
# pubDate, ADR 0003) and this one. This only helps if the enable call resets GitHub's inactivity
# counter, which GitHub does not document. Fallback: a push to master at least every 60 days.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/deploy.yml/enable
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
